name: Build Aero UI mod

# Build the Fabric "hard lock" resource-pack mod (aero-ui-mod) into a jar.
# Runs on any change to the mod, and can be dispatched manually. The jar is
# uploaded as a build artifact; download it from the run to bundle in the app.

on:
  push:
    paths:
      - "aero-ui-mod/**"
      - ".github/workflows/build-aero-mod.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build the mod
        working-directory: aero-ui-mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: aero-ui-mod-jar
          path: aero-ui-mod/build/libs/aero-ui-*.jar
          if-no-files-found: error
