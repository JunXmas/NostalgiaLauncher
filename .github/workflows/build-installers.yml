name: Build installers

# Máy phát triển chạy Linux, mà không có cách nào build ra .exe hay .app từ đó:
# PyInstaller gói lại đúng trình thông dịch Python và đúng thư viện Qt của hệ
# điều hành đang chạy, nên bắt buộc phải build trên chính nền tảng đích. Runner
# của GitHub đóng vai chiếc máy Windows và máy Mac mà ta không có.

on:
  push:
    tags: ["v*"]        # gắn tag v0.2.0 là ra một bản phát hành
  workflow_dispatch: {}  # hoặc bấm tay trong tab Actions

permissions:
  contents: write        # cần quyền ghi để đính file vào Release

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # Windows hỏng thì vẫn muốn xem bản Mac có ra không
      matrix:
        include:
          - os: windows-latest
            label: Windows (x64)
          - os: ubuntu-latest
            label: Linux (x64)
          - os: macos-14
            label: macOS (Apple Silicon)
          # macOS Intel (macos-13) tạm bỏ: runner Intel của GitHub xếp hàng quá
          # lâu, chặn cả bản phát hành. Thêm lại khi cần phủ máy Mac Intel:
          #   - os: macos-13
          #     label: macOS (Intel)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install PySide6-Essentials pyinstaller

      - name: Install Qt system libraries (Linux)
        # Runner Linux trần thiếu lib hệ thống Qt cần để chỉ import QtGui (libEGL…),
        # nên cả make_icon lẫn pyinstaller đều đổ. Cài trước là qua.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxcb-cursor0 \
            libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libdbus-1-3

      - name: Generate icons
        # Runner không có màn hình; offscreen cho phép Qt vẽ thẳng vào bộ nhớ.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/make_icon.py

      - name: Build app bundle
        run: pyinstaller packaging/nostalgia.spec --noconfirm

      # ---------- Windows ----------
      # Ký app trước khi Inno gói lại, để bản đã cài cũng có chữ ký. Không có
      # secret chứng chỉ thì sign.ps1 tự bỏ qua.
      - name: Sign the app executable
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: pwsh packaging\windows\sign.ps1 -Paths "dist\Nostalgia Launcher\Nostalgia Launcher.exe"
        shell: pwsh

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: |
          choco install innosetup --no-progress -y
          # Dấu ngoặc trong tên biến bắt buộc phải bọc bằng ${...}: viết
          # $env:ProgramFiles(x86) thì PowerShell hiểu là lời gọi hàm và báo lỗi cú pháp.
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\nostalgia.iss
        shell: pwsh

      - name: Sign the Windows installer
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: pwsh packaging\windows\sign.ps1 -Paths "dist\installer\*.exe"
        shell: pwsh

      # ---------- Linux ----------
      - name: Build Linux .deb package
        if: runner.os == 'Linux'
        run: bash packaging/linux/build-deb.sh

      # ---------- macOS ----------
      - name: Build macOS disk image
        if: runner.os == 'macOS'
        run: bash packaging/macos/build-dmg.sh

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: dist/installer/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4      # cần CHANGELOG.md để dựng mô tả release

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build release notes
        # Lấy phần changelog của đúng phiên bản (tag v0.2.7 -> mục 0.2.7) làm
        # mô tả release, kèm ghi chú cài đặt.
        run: bash packaging/release_notes.sh "${GITHUB_REF_NAME#v}" release_notes.md

      - name: Attach installers to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true              # để nháp, xem lại rồi mới bấm công bố
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          body_path: release_notes.md
