name: Release

# Chạy khi đẩy tag `vX.Y.Z`. Mỗi hệ dựng gói PyInstaller onedir, CHẠY THỬ gói đó
# (NOSTALGIA_SMOKE_TEST=1: nạp QML + cầu nối rồi thoát), rồi đóng thành bộ cài:
#   Linux x64   : .zip (bộ tự cập nhật), .tar.gz, .AppImage, .deb, .rpm
#   macOS       : .zip (bộ tự cập nhật) + .dmg, riêng cho Apple Silicon (arm64) và Intel (x64)
#   Windows x64 : .zip (bộ tự cập nhật) + bộ cài setup.exe (Inno Setup)
# Kết quả là GitHub Release DRAFT chỉ kèm bộ cài; checksum nằm trong nội dung release.
# (bộ tự cập nhật chỉ nhìn thấy bản đã publish).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --extra ui
      - name: Thư viện cho Qt chạy không màn hình
        # Kho Google Chrome cài sẵn trong ảnh runner hay lệch băm (Hash Sum mismatch) làm
        # `apt-get update` rớt dù ta không cần nó: gỡ nguồn lạ, và lỗi cập nhật chỉ mục không
        # được chặn bước cài (gói cần đều nằm trong kho Ubuntu, cài rớt thì vẫn báo rớt).
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/microsoft-edge*.list
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Tag phải khớp phiên bản trong mã
        run: |
          expected="v$(uv run python -c 'import nostalgia; print(nostalgia.__version__)')"
          test "${GITHUB_REF_NAME}" = "${expected}" || { echo "tag ${GITHUB_REF_NAME} khác ${expected}"; exit 1; }
      - run: uv run ruff check . && uv run ruff format --check . && uv run mypy
      - run: uv run pytest -m "not network" -q

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundle_os: linux
            bundle_arch: x64
          - os: windows-latest
            bundle_os: windows
            bundle_arch: x64
          - os: macos-14
            bundle_os: macos
            bundle_arch: arm64
          - os: macos-15-intel
            bundle_os: macos
            bundle_arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      NOSTALGIA_BUILD_FLAVOR: ${{ github.ref_name == 'v1.2.0rc8' && 'review' || 'release' }}
      BUNDLE_NAME: nostalgia-${{ github.ref_name }}-${{ matrix.bundle_os }}-${{ matrix.bundle_arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --extra ui --group build

      - name: Tích hợp địa chỉ Google, không yêu cầu người chơi nhập
        env:
          NOSTALGIA_BUILD_ACCOUNT_URL: ${{ vars.NOSTALGIA_ACCOUNT_URL }}
          NOSTALGIA_BUILD_ROOM_SYNC_URL: ${{ vars.NOSTALGIA_ROOM_SYNC_URL }}
        run: uv run python packaging/configure-services.py

      - name: Icon .icns cho macOS
        if: matrix.bundle_os == 'macos'
        run: |
          set -e
          mkdir -p nostalgia.iconset
          for size in 16 32 128 256; do
            sips -z $size $size packaging/icons/nostalgia.png --out nostalgia.iconset/icon_${size}x${size}.png >/dev/null
            double=$((size * 2))
            sips -z $double $double packaging/icons/nostalgia.png --out nostalgia.iconset/icon_${size}x${size}@2x.png >/dev/null
          done
          iconutil -c icns nostalgia.iconset -o packaging/icons/nostalgia.icns

      - name: Đóng gói bằng PyInstaller
        run: uv run pyinstaller --noconfirm packaging/nostalgia-ui.spec

      - name: Kiểm tra tách biệt mã review và release
        run: uv run python packaging/verify-build-flavor.py

      - name: Chạy thử gói đóng sẵn (Linux)
        if: matrix.bundle_os == 'linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/microsoft-edge*.list
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libfontconfig1
          NOSTALGIA_SMOKE_TEST=1 QT_QPA_PLATFORM=offscreen HOME="$RUNNER_TEMP/home" dist/nostalgia-ui/nostalgia-ui
      - name: Chạy thử gói đóng sẵn (macOS)
        if: matrix.bundle_os == 'macos'
        run: NOSTALGIA_SMOKE_TEST=1 QT_QPA_PLATFORM=offscreen HOME="$RUNNER_TEMP/home" "dist/Nostalgia Launcher.app/Contents/MacOS/nostalgia-ui"
      - name: Chạy thử gói đóng sẵn (Windows)
        if: matrix.bundle_os == 'windows'
        shell: pwsh
        run: |
          $env:NOSTALGIA_SMOKE_TEST = "1"
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:USERPROFILE = "$env:RUNNER_TEMP\home"
          $proc = Start-Process -FilePath "dist\nostalgia-ui\nostalgia-ui.exe" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "gói Windows thoát mã $($proc.ExitCode)" }

      - name: Gói zip cho bộ tự cập nhật (Linux, Windows)
        if: matrix.bundle_os != 'macos'
        shell: bash
        run: |
          mkdir -p out
          name="nostalgia-${GITHUB_REF_NAME#v}-${{ matrix.bundle_os }}-${{ matrix.bundle_arch }}"
          python -c "import shutil; shutil.copytree('dist/nostalgia-ui', 'build/zip/Nostalgia'); shutil.make_archive('out/${name}', 'zip', 'build/zip', 'Nostalgia')"
      - name: Gói zip + dmg (macOS)
        if: matrix.bundle_os == 'macos'
        run: |
          set -e
          mkdir -p out build/dmg
          name="nostalgia-${GITHUB_REF_NAME#v}-${{ matrix.bundle_os }}-${{ matrix.bundle_arch }}"
          ditto -c -k --keepParent "dist/Nostalgia Launcher.app" "out/${name}.zip"
          cp -R "dist/Nostalgia Launcher.app" build/dmg/
          ln -s /Applications build/dmg/Applications
          for attempt in 1 2 3; do
            hdiutil create -volname "Nostalgia Launcher" -srcfolder build/dmg -ov -format UDZO "out/${name}.dmg" && break
            echo "hdiutil attempt $attempt failed, retrying in 5s..."
            sleep 5
          done

      - name: AppImage, deb, rpm, tar.gz (Linux)
        if: matrix.bundle_os == 'linux'
        run: |
          set -e
          sudo apt-get install -y -qq rpm
          curl -sSL -o appimagetool "$APPIMAGETOOL_URL"
          echo "$APPIMAGETOOL_SHA256  appimagetool" | sha256sum -c -
          chmod +x appimagetool && ./appimagetool --appimage-extract >/dev/null
          APPIMAGETOOL="$PWD/squashfs-root/AppRun" packaging/linux/build-packages.sh "${GITHUB_REF_NAME#v}"
      - name: Bộ cài setup.exe (Windows, Inno Setup)
        if: matrix.bundle_os == 'windows'
        shell: pwsh
        run: |
          $env:NOSTALGIA_VERSION = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC thoát mã $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.bundle_os }}-${{ matrix.bundle_arch }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      - name: Tạo release DRAFT (chủ dự án publish tay)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(bundles/*-setup.exe bundles/*.deb bundles/*.AppImage bundles/*.rpm bundles/*.dmg)
          test "${#assets[@]}" -gt 0
          cp docs/RELEASE_NOTES.md release-notes.md
          {
            printf '\n<details>\n<summary>SHA-256 của các bộ cài</summary>\n\n```text\n'
            for asset in "${assets[@]}"; do
              digest="$(sha256sum "$asset")"
              printf '%s  %s\n' "${digest%% *}" "${asset##*/}"
            done
            printf '```\n\n</details>\n'
          } >> release-notes.md
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" --draft --title "Nostalgia Launcher ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
