name: Draft review files

on:
  push:
    branches: [preview/glass-review]
    paths:
      - .github/workflows/draft-review-files.yml
      - docs/DRAFT_TEST_GUIDE.md
      - docs/RC5_VALIDATION.md
      - docs/UI_MOTION_REVIEW.md
      - docs/preview/rc5/**

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm hash hướng dẫn và ảnh, xác định tag đã build
        run: |
          python - <<'PY'
          import hashlib
          import os
          import re
          from pathlib import Path
          version = re.search(r'__version__ = "([^"]+)"', Path('src/nostalgia/__init__.py').read_text()).group(1)
          folder = Path('docs/preview/rc5')
          installers = (folder / 'SHA256SUMS').read_text().splitlines()
          assert installers and all(version in line.split()[1] for line in installers)
          artifacts = {path.name: path for path in folder.iterdir() if path.suffix in ('.png', '.gif')}
          artifacts.update({name: Path('docs') / name for name in ('DRAFT_TEST_GUIDE.md', 'RC5_VALIDATION.md', 'UI_MOTION_REVIEW.md')})
          seen = set()
          for line in (folder / 'PREVIEW_SHA256SUMS').read_text().splitlines():
              checksum, name = line.split(maxsplit=1)
              assert name in artifacts and name not in seen
              assert hashlib.sha256(artifacts[name].read_bytes()).hexdigest() == checksum
              seen.add(name)
          assert seen == set(artifacts)
          with Path(os.environ['GITHUB_ENV']).open('a') as output:
              output.write('DRAFT_REVIEW_TAG=v' + version + '\n')
          PY
      - name: Chỉ đính kèm vào release draft đã có bộ cài
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYUPLOAD'
          import json
          import os
          import subprocess
          import urllib.parse
          import urllib.request
          from pathlib import Path
          repository = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['DRAFT_REVIEW_TAG']
          def api(path, *arguments):
              return subprocess.check_output(['gh', 'api', path, *arguments])
          releases = json.loads(api(f'repos/{repository}/releases?per_page=100'))
          release = next(value for value in releases if value['tag_name'] == tag)
          assert release['draft'] and not release['prerelease']
          assets = {value['name']: value['id'] for value in release['assets']}
          folder = Path('docs/preview/rc5')
          artifacts = [Path('docs') / name for name in ('DRAFT_TEST_GUIDE.md', 'RC5_VALIDATION.md', 'UI_MOTION_REVIEW.md')]
          artifacts += [folder / 'PREVIEW_SHA256SUMS', *sorted(folder.glob('*.png')), *sorted(folder.glob('*.gif'))]
          for artifact in artifacts:
              if artifact.name in assets:
                  api(f'repos/{repository}/releases/assets/{assets[artifact.name]}', '--method', 'DELETE')
              url = release['upload_url'].split('{')[0] + '?' + urllib.parse.urlencode({'name': artifact.name})
              request = urllib.request.Request(url, data=artifact.read_bytes(), method='POST', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/octet-stream',
              })
              with urllib.request.urlopen(request, timeout=60) as response:
                  uploaded = json.load(response)
              assert uploaded['name'] == artifact.name and uploaded['size'] == artifact.stat().st_size
              print('Attached', artifact.name)
          PYUPLOAD
