name: Build Aero Forge mod

# Forge 1.12.2 hard-lock mod, build bằng RetroFuturaGradle (RFG) — ForgeGradle 2 đã
# chết (không phân giải được forge-userdev). RFG: Gradle 9.5 + JDK 8 toolchain (foojay
# tự tải). Tách khỏi build-aero-mod.yml (Fabric/loom).

on:
  push:
    paths:
      - "aero-forge-mod/**"
      - ".github/workflows/build-aero-forge.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"       # chạy Gradle; JDK 8 toolchain do RFG/foojay tự tải
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Build the Forge mod
        working-directory: aero-forge-mod
        run: gradle build --no-daemon --stacktrace
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: aero-forge-mod
          path: aero-forge-mod/build/libs/aero-forge-*.jar
          if-no-files-found: error
