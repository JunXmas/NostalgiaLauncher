name: Build Aero Forge mod

# Forge 1.12.2 hard-lock mod, build bằng RetroFuturaGradle (RFG) — ForgeGradle 2 đã
# chết (không phân giải được forge-userdev). RFG: Gradle 9.5 + JDK 8 toolchain (foojay
# tự tải). Tách khỏi build-aero-mod.yml (Fabric/loom).

on:
  push:
    paths:
      - "aero-forge-mod/**"
      - ".github/workflows/build-aero-forge.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ["1122", "189"]   # Forge 1.12.2 và 1.8.9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"       # RFG 2.0.2 cần Java 25 để chạy; JDK 8 toolchain do foojay tự tải
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Build the Forge mod (${{ matrix.target }})
        working-directory: aero-forge-mod
        run: gradle build -PforgeTarget=${{ matrix.target }} --no-daemon --stacktrace
      - name: Upload mod jar (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: aero-forge-mod-${{ matrix.target }}
          path: aero-forge-mod/build/libs/aero-forge-${{ matrix.target }}-*.jar
          if-no-files-found: error
