<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nostalgia Launcher — Tải xuống</title>
<meta name="description" content="Minecraft launcher: tài khoản, instance, mod, LAN qua relay. Trang tự dò hệ điều hành và đưa đúng một nút tải.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0d0b'/%3E%3Crect x='9' y='9' width='14' height='14' fill='%234ade80'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="mark" aria-hidden="true"></div>
  <h1>Nostalgia Launcher</h1>
  <p class="tagline">Tài khoản, instance, mod, chơi LAN qua relay — một launcher, không rườm rà.</p>
</header>

<main>
  <section id="download" class="download" aria-live="polite">
    <p id="download-status" class="status">Đang dò bản mới nhất…</p>
    <a id="primary-download" class="btn-primary" href="https://github.com/JunXmas/NostalgiaLauncher/releases/latest" hidden>
      <span id="primary-label">Tải xuống</span>
      <span id="primary-meta" class="btn-meta"></span>
    </a>
    <details id="other-files" hidden>
      <summary>Hệ điều hành khác / file khác</summary>
      <ul id="other-files-list"></ul>
    </details>
  </section>

  <section class="showcase">
    <figure><img src="../showcase/home.jpg" alt="Màn hình chính của launcher" loading="lazy"><figcaption>Màn hình chính</figcaption></figure>
    <figure><img src="../showcase/create-instance.jpg" alt="Tạo instance mới" loading="lazy"><figcaption>Tạo instance</figcaption></figure>
    <figure><img src="../showcase/library.jpg" alt="Thư viện mod" loading="lazy"><figcaption>Thư viện mod</figcaption></figure>
    <figure><img src="../showcase/multiplayer.jpg" alt="Chơi mạng LAN qua relay" loading="lazy"><figcaption>LAN qua relay</figcaption></figure>
  </section>
</main>

<footer>
  <a href="https://github.com/JunXmas/NostalgiaLauncher">Mã nguồn trên GitHub</a>
</footer>

<script src="app.js"></script>
</body>
</html>
