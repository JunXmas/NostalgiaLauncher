// Build đa phiên bản từ MỘT source (AeroUiClient + PackRepositoryMixin). Chọn era
// bằng -PaeroTarget=<key> (mặc định 121). Mỗi era một toolchain vì ranh giới
// obfuscate của Minecraft:
//   • 121: 1.21.x CÒN obfuscate  -> plugin fabric-loom-remap + officialMojangMappings
//          -> jar được remap sang INTERMEDIARY (chạy runtime intermediary).
//   • 26x: 26.x KHÔNG obfuscate   -> plugin fabric-loom (thường), không mappings
//          -> jar giữ tên Mojang (chạy runtime Mojang-native).
// Loom jar đăng ký CẢ hai plugin id nên nạp qua buildscript rồi apply theo era.
buildscript {
	repositories {
		maven { url = 'https://maven.fabricmc.net/' }
		gradlePluginPortal()
		mavenCentral()
	}
	dependencies {
		classpath "net.fabricmc:fabric-loom:${loom_version}"
	}
}

ext.aeroTarget = (project.findProperty('aeroTarget') ?: '121').toString()
ext.TARGETS = [
	// packFormat = resource_major của bản (version.json) -> pack.mcmeta khớp đúng,
	// kẻo game GỠ pack vì "incompatible" (1.21.11=75, 26.2=88, 1.20.6=32).
	// era = biến thể source của AeroUiClient (modern=Identifier / legacy=ResourceLocation).
	// release = phiên bản bytecode: phải ≤ Java runtime của game (1.20.x chạy Java 17).
	'121': [mc: '1.21.11', api: '0.141.6+1.21.11', plugin: 'net.fabricmc.fabric-loom-remap', mojmap: true,  packFormat: 75, era: 'modern', release: 21, mcDep: '>=1.21'],
	'26x': [mc: '26.2',    api: '0.157.0+26.2',    plugin: 'net.fabricmc.fabric-loom',       mojmap: false, packFormat: 88, era: 'modern', release: 21, mcDep: '>=1.21'],
	'20x': [mc: '1.20.6',  api: '0.100.8+1.20.6',  plugin: 'net.fabricmc.fabric-loom-remap', mojmap: true,  packFormat: 32, era: 'legacy', release: 17, mcDep: '>=1.20 <1.21'],
]
def T = TARGETS[aeroTarget]
if (T == null) throw new GradleException("Unknown aeroTarget '${aeroTarget}' (use one of ${TARGETS.keySet()})")

apply plugin: T.plugin
apply plugin: 'maven-publish'

base {
	// jar riêng cho từng era: aero-ui-121-1.0.0.jar / aero-ui-26x-1.0.0.jar
	archivesName = "aero-ui-${aeroTarget}"
}

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"aero-ui" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// AeroUiClient khác nhau theo era (Identifier vs ResourceLocation) -> thêm thư mục
// source đúng era vào sourceSet client. Mixin nằm ở src/client/java dùng chung.
sourceSets.client.java.srcDir "src/client-${T.era}/java"

dependencies {
	minecraft "com.mojang:minecraft:${T.mc}"
	// Bản obfuscate: dev map = official Mojang (source giữ tên Identifier/PackRepository),
	// loom remap jar sang intermediary. Bản không obfuscate: MC đã là tên Mojang -> khỏi.
	if (T.mojmap) {
		mappings loom.officialMojangMappings()
	}
	// Bản obfuscate cần remap dep mod -> modImplementation. Bản không obfuscate
	// (fabric-loom thường) KHÔNG có cấu hình modImplementation vì chẳng remap gì,
	// nên dùng implementation. Chọn động theo era.
	def modDep = T.mojmap ? 'modImplementation' : 'implementation'
	add(modDep, "net.fabricmc:fabric-loader:${project.loader_version}")
	add(modDep, "net.fabricmc.fabric-api:fabric-api:${T.api}")
}

processResources {
	def version = project.version
	inputs.property "version", version
	inputs.property "packFormat", T.packFormat

	filesMatching("fabric.mod.json") {
		expand "version": version, "mcDep": T.mcDep, "javaDep": ">=${T.release}".toString()
	}
	// pack.mcmeta có ${packFormat} -> thay bằng format của era đang build.
	filesMatching("resourcepacks/aero-ui/pack.mcmeta") {
		expand "packFormat": T.packFormat
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = T.release   // bytecode ≤ Java runtime của game theo era
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(T.release)
	targetCompatibility = JavaVersion.toVersion(T.release)
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
