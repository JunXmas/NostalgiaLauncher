[project]
name = "mccore"
version = "0.1.0"
description = "Lõi launcher Minecraft: cài đặt và khởi động game. Không giao diện."
requires-python = ">=3.12"
dependencies = ["requests>=2.31"]

[project.scripts]
mccore = "mccore.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mccore"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: cần Internet thật; mặc định bị bỏ qua",
    "slow: chạy lâu (tải file lớn, khởi động game)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "RUF", "PTH", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
