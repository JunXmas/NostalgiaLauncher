[project]
name = "nostalgia"
version = "0.1.0"
description = "Nostalgia Launcher — lõi trình khởi động Minecraft: cài đặt và khởi động game. Không giao diện."
readme = "README.md"
requires-python = ">=3.12"
# Không phụ thuộc runtime. Mọi thứ HTTP dùng http.client của thư viện chuẩn — xem
# docs/PERFORMANCE.md §2 để biết vì sao (nhanh hơn requests 1,5x khi song song, nạp rẻ hơn).
dependencies = []

[project.scripts]
nostalgia = "nostalgia.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nostalgia"]
# py.typed: báo cho bộ kiểm kiểu của người dùng biết gói này có chú kiểu. Không có nó,
# giao diện tương lai gọi nostalgia.api sẽ không thấy kiểu nào cả.
artifacts = ["src/nostalgia/py.typed"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network' --strict-markers --strict-config"
markers = [
    "network: cần Internet thật; mặc định bị bỏ qua",
    "slow: chạy lâu (tải file lớn, khởi động game)",
    "allow_home: được phép gọi Path.home(); mặc định mọi test đều bị cấm",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# ARG bắt tham số chết — đã tìm ra hai fixture pytest nhận rồi không dùng.
select = ["E", "W", "F", "I", "UP", "B", "ANN", "ARG", "RUF", "PTH", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
# Chú kiểu mà không kiểm kiểu thì chỉ tốn công. GLOSSARY.md dành hẳn hai mục nói về kiểu
# (Path vs str, dataclass frozen), nên phần lớn từ điển chỉ có giá trị khi có bộ kiểm kiểu.
files = ["src", "tests", "bench"]
python_version = "3.12"
strict = true
warn_unreachable = true
